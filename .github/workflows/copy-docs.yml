name: Copy Docs to Website

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to copy docs from (for example, 10.x)
        required: true
        type: string

permissions:
  contents: read

jobs:
  checkout-copy-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Finbuckle.MultiTenant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.branch }}
          fetch-depth: 0
      - name: Resolve docs release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION=$(gh release list \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName')
          fi

          if [ -z "$VERSION" ]; then
            echo "No published release tag was found." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_ENV"
      - name: Checkout Website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          repository: Finbuckle/Website
          token: ${{ secrets.workflow_pat }}
          path: website
      - name: Copy Docs
        run: mkdir -p website/content/docs/${{ env.version }} && cp docs/* website/content/docs/${{ env.version }}
      - name: Checkin Website
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "chore: docs generated" && git push)
