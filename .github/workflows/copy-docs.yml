name: Copy Docs to Website

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to copy docs from (for example, 10.x)
        required: true
        type: string

permissions:
  contents: read

jobs:
  checkout-copy-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Finbuckle.MultiTenant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Resolve latest version on branch
        run: |
          VERSION=$(git tag --merged HEAD --list 'v*' --sort=-version:refname | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "No version tag was found on branch '${{ inputs.branch }}'." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_ENV"
      - name: Checkout Website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          repository: Finbuckle/Website
          token: ${{ secrets.workflow_pat }}
          path: website
      - name: Copy Docs
        run: |
          rm -rf "website/content/docs/${{ env.version }}"
          mkdir -p "website/content/docs/${{ env.version }}"
          cp docs/* "website/content/docs/${{ env.version }}"
      - name: Checkin Website
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "chore: docs generated" && git push)
