name: Draft Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11
      - name: build and test
        run: |
          dotnet restore
          dotnet build -c Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet test -c Release --no-build
      - name: prepare release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet prepare-release.cs
      # Release branches require verified signatures, so the release commit is created through the
      # GraphQL API, which GitHub signs, instead of being pushed from the runner.
      - name: commit and tag
        if: steps.prepare.outputs.bump_level != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.prepare.outputs.new_version }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/release-commit"
          mkdir -p "$work"
          git add -A

          : > "$work/additions.jsonl"
          git diff --cached --name-only -z --diff-filter=d | while IFS= read -r -d '' path; do
            base64 -w0 "$path" > "$work/contents.b64"
            jq -n --arg path "$path" --rawfile contents "$work/contents.b64" \
              '{path: $path, contents: $contents}' >> "$work/additions.jsonl"
          done

          : > "$work/deletions.jsonl"
          git diff --cached --name-only -z --diff-filter=D | while IFS= read -r -d '' path; do
            jq -n --arg path "$path" '{path: $path}' >> "$work/deletions.jsonl"
          done

          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg head "$(git rev-parse HEAD)" \
            --arg headline "chore: release $NEW_VERSION" \
            --slurpfile additions "$work/additions.jsonl" \
            --slurpfile deletions "$work/deletions.jsonl" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: $headline },
                fileChanges: { additions: $additions, deletions: $deletions }
              } }
            }' > "$work/payload.json"

          oid=$(gh api graphql --input "$work/payload.json" --jq '.data.createCommitOnBranch.commit.oid')
          if [ -z "$oid" ] || [ "$oid" = "null" ]; then
            echo "createCommitOnBranch did not return a commit" >&2
            exit 1
          fi
          echo "Created release commit $oid on $GITHUB_REF_NAME"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$NEW_VERSION" -f sha="$oid"
      - name: create draft release
        if: steps.prepare.outputs.bump_level != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.prepare.outputs.new_version }} \
            --title "${{ steps.prepare.outputs.new_version }}" \
            --notes-file "${{ steps.prepare.outputs.release_notes_file }}" \
            --draft
