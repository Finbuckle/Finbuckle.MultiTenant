name: Draft Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10
      - name: build and test
        run: |
          dotnet restore
          dotnet build -c Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet test -c Release --no-build
      - name: prepare release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet prepare-release.cs
      - name: commit, tag and push
        if: steps.prepare.outputs.bump_level != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release ${{ steps.prepare.outputs.new_version }}"
          git tag ${{ steps.prepare.outputs.new_version }}
          git push origin HEAD
          git push origin ${{ steps.prepare.outputs.new_version }}
      - name: create draft release
        if: steps.prepare.outputs.bump_level != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.prepare.outputs.new_version }} \
            --title "${{ steps.prepare.outputs.new_version }}" \
            --notes-file "${{ steps.prepare.outputs.release_notes_file }}" \
            --draft
